<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vuong">
  <!--
    Browser-tab icon: the "V" mark from components/brand/logo.tsx, set on a
    brand-coloured tile so it stays legible at 16 px — a two-tone outline mark
    muddies at that size. Rendered to the PNG variants by
    `scripts/generate-icons.mjs` (`pnpm icons`).
  -->
  <rect width="32" height="32" rx="8" fill="#b45309" />
  <path d="M9.5 9 16 23.5" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" />
  <path d="M22.5 9 16 23.5" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" opacity="0.72" />
</svg>
